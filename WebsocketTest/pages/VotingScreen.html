<!DOCTYPE html>
<html lang="en" style="--bg-color: #D9D9D9;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voting Screen</title>
    <link rel="stylesheet" href="Design.css">
</head>
<body>
    <div class="WaitingScreen">

        <div class="voting-content" id="votingContent">
            <h1 class="voting-title">
                Round <span id="roundNumber">1</span>: Voting phase
            </h1>

            <p id="timer">Time left: --</p>

            <div class="slider-container">
                <input 
                    type="range" 
                    min="0" 
                    max="100" 
                    value="50" 
                    class="voting-slider" 
                    id="voteSlider"
                >

                <div class="slider-labels">
                    <span class="slider-label">Totally disagree</span>
                    <span class="slider-label">Neutral</span>
                    <span class="slider-label">Totally agree</span>
                </div>

                <p id="voteValue">50</p>
            </div>

            <button class="submit-btn" id="submitVoteBtn">Submit Vote</button>

            <p id="status">Choose your position on the scale</p>
        </div>

        <div class="voting-content" id="waitingContent" style="display: none;">
            <h1 class="voting-title">Well done!</h1>
            <p id="waitingText">Your vote has been saved. Waiting for the other players...</p>
        </div>

        <div id="log"></div>

    </div>

    <script src="characterWidget.js"></script>
    <script src="VotingScreen.js"></script>
</body>
</html>
