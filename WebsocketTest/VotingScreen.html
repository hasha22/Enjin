<!DOCTYPE html>
<html lang="en" style="--bg-color: #D9D9D9;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voting Screen</title>
    <link rel="stylesheet" href="Design.css">
</head>
<body>
    <div class="WaitingScreen">
        <div class="circle" style="background-color: #FF6B6B;">
            <img src="Char1Face.png" alt="profile" class="circle-image" id="profileImage">
        </div>
    

        <div class="modal" id="imageModal">
            <div class="modal-content">
                <img src="Char1.png" alt="profile enlarged">
            <div class="modal-right-section">
                <div class="text-box" style="background-color: #FFFFFF;">Box 1 Text</div>
                <div class="text-box" style="background-color: #FF6B6B;">Box 2 Text</div>
                <div class="modal-text">Your text here</div>
            </div>
                </div>
        </div>

        <div class="voting-content">
            <h1 class="voting-title">Voting phase</h1>
            
            <div class="slider-container">
                <input type="range" min="0" max="100" value="50" class="voting-slider" id="votingSlider">
                <div class="slider-labels">
                    <span class="slider-label">Strongly agree</span>
                    <span class="slider-label">Neutral</span>
                    <span class="slider-label">Strongly disagree</span>
                </div>
            </div>

            <button class="submit-btn" id="submitBtn">Submit Vote</button>
        </div>
    </div>
    </div>
        

    <script>
        const profileImage = document.getElementById('profileImage');
        const imageModal = document.getElementById('imageModal');

        profileImage.addEventListener('click', function() {
            imageModal.classList.add('active');
        });

        imageModal.addEventListener('click', function(e) {
            if (e.target === imageModal) {
                imageModal.classList.remove('active');
            }
        });

    </script>
</body>
</html>
